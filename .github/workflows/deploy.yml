name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://sagyopsmbkylppyivpoe.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_nYMFye-t9tDcSDr9_4u3rQ_pllpO3yu"
          VITE_SUPABASE_PROJECT_ID: "sagyopsmbkylppyivpoe"

      - name: Prepare static deploy
        run: |
          echo "=== Files in .output/public ==="
          ls -laR .output/public/

          # Find the CSS and JS entry files
          CSS_FILE=$(find .output/public/assets -name "index-*.css" | head -1 | sed 's|^.output/public/||')
          JS_FILE=$(find .output/public/assets -name "index-*.js" | head -1 | sed 's|^.output/public/||')

          echo "CSS: $CSS_FILE"
          echo "JS:  $JS_FILE"

          # Create index.html
          cat > .output/public/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>frithfrountequity Bank - Online Banking</title>
              <link rel="stylesheet" href="/${CSS_FILE}" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/${JS_FILE}"></script>
            </body>
          </html>
          EOF

          # Create _redirects for SPA routing
          echo "/*    /index.html   200" > .output/public/_redirects

          echo ""
          echo "=== Generated index.html ==="
          cat .output/public/index.html
          echo ""
          echo "=== All files to deploy ==="
          find .output/public -type f

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=.output/public --site=112b4479-db85-4364-9fc4-7c554ee163e5 --auth=nfp_rfqfz3GtnNJZqZidcjCCW5Rmke2rSxZV7f81
